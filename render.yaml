# IMPORTANT: Render may ignore startCommand here and use its default.
# To force the correct gunicorn config, set the Start Command MANUALLY in:
#   Render Dashboard -> Service -> Settings -> Start Command
# Set it to:
#   gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 8 --worker-class gthread --timeout 900 --graceful-timeout 30 --keep-alive 5 --log-level info app:app

databases:
  - name: bdc-portfolio-db
    databaseName: portfolio
    user: portfolio_user
    plan: free

services:
  - type: web
    name: bdc-investment-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 900 --workers 2 --threads 8 --worker-class gthread --graceful-timeout 30 --keep-alive 5 --log-level info app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bdc-portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: PORTFOLIO_EXPORT_TOKEN
        sync: false
      - key: PORTFOLIO_EXPORT_USER_EMAIL
        sync: false
      - key: RESEARCH_DATABASE_URL
        sync: false
      - key: SELF_BASE_URL
        sync: false
      - key: RESEARCH_LIVE_MODE
        value: "true"
      - key: STAGE1_TRANSCRIPT_MAX_WORDS
        value: "12000"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: SUPADATA_API_KEY
        sync: false
      - key: GEMINI_STAGE1_MODEL
        value: gemini-3.1-pro-preview
      - key: GEMINI_STAGE4_MODEL
        value: gemini-3.1-pro-preview
      - key: GEMINI_STAGE1_THINKING_LEVEL
        value: low
      - key: GEMINI_STAGE4_THINKING_LEVEL
        value: medium
      - key: CLAUDE_STAGE2_MODEL
        value: claude-opus-4-6
      - key: CLAUDE_STAGE3_MODEL
        value: claude-opus-4-6
      - key: CLAUDE_STAGE5_MODEL
        value: claude-opus-4-7
      - key: OPENAI_STAGE3_PLAN_MODEL
        value: gpt-5.5
      - key: OPENAI_STAGE3_PLAN_EFFORT
        value: medium
      - key: PERPLEXITY_STAGE3_MODEL
        value: sonar-pro
