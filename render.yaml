databases:
  - name: bdc-portfolio-db
    databaseName: portfolio
    user: portfolio_user
    plan: free

services:
  - type: web
    name: bdc-investment-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 600 --worker-class gthread --threads 4 --log-level debug app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bdc-portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: PORTFOLIO_EXPORT_TOKEN
        sync: false
      - key: PORTFOLIO_EXPORT_USER_EMAIL
        sync: false
      - key: RESEARCH_DATABASE_URL
        sync: false
      - key: SELF_BASE_URL
        sync: false
      - key: RESEARCH_LIVE_MODE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_STAGE1_MODEL
        value: gemini-2.5-pro
      - key: GEMINI_STAGE4_MODEL
        value: gemini-2.5-pro
      - key: CLAUDE_STAGE2_MODEL
        value: claude-opus-4-6
      - key: CLAUDE_STAGE3_MODEL
        value: claude-opus-4-6
      - key: CLAUDE_STAGE5_MODEL
        value: claude-opus-4-7
      - key: PERPLEXITY_STAGE3_MODEL
        value: sonar-pro
